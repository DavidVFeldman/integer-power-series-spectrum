name = "RequestProject"
defaultTargets = ["RequestProject", "WeierstrassFormalization", "SpectrumFormalization"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "WeierstrassFormalization"
globs = ["WeierstrassFormalization.+"]

[[lean_lib]]
name = "SpectrumFormalization"
globs = ["SpectrumFormalization.+"]
