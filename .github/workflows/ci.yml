name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escape-hatch census
        run: |
          ! grep -rn --include='*.lean' -E '\bsorry\b|\badmit\b|native_decide|^axiom|@\[implemented_by\]' \
            RequestProject/ WeierstrassFormalization/ SpectrumFormalization/

      - name: Build (with Mathlib cache)
        uses: leanprover/lean-action@v1
